name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  pull_request:
    paths: ['website/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_dispatch:
  # Called by the release workflow so the download area picks up the new files.
  workflow_call:
    inputs:
      expect-tag:
        description: Release tag the download data must include (fails the build otherwise)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (types and Astro checks)
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Release data (GitHub Releases API)
        run: pnpm releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECT_TAG: ${{ inputs.expect-tag }}
          REQUIRE_RELEASES: ${{ inputs.expect-tag != '' && '1' || '' }}
      - name: Build
        run: pnpm build:offline
      - name: Check output
        run: |
          for l in en pt-br es fr de; do test -f "dist/$l/index.html" || { echo "missing $l"; exit 1; }; done
          test -f dist/index.html && test -f dist/404.html && test -f dist/sitemap-index.xml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
