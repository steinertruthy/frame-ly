name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-15
          - name: Windows (x64)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # pnpm scripts (llm:build) are bash scripts; on Windows run them with Git Bash.
      npm_config_script_shell: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\Git\bin\bash.exe' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/llm-worker

      - name: Xcode 26 (macOS 26 SDK, needed for Apple Intelligence)
        if: runner.os == 'macOS'
        run: |
          xc=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -1)
          if [ -z "$xc" ]; then echo "::warning::No Xcode 26 on this runner; Apple Intelligence code is compiled out"; exit 0; fi
          sudo xcode-select -s "$xc" && xcodebuild -version && xcrun --show-sdk-version

      - name: Native build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm check
          pnpm test

      - name: Version files agree
        run: node scripts/release/check-version.mjs

      - name: Swift engine tests (FrameLyKit)
        if: runner.os == 'macOS'
        working-directory: native/macos/FrameLyKit
        # Skipped here: tests that need a visible window or real-time A/V timing, which hosted
        # VMs don't provide. Run them locally (swift test).
        run: >-
          swift test
          --skip AVSyncTests
          --skip CaptureTests.testWindowCaptureWhenPermitted
          --skip RecorderTests.testRecordsSingleWindow

      - name: Local AI worker (sidecar)
        shell: bash
        run: ./scripts/build-llm-worker.sh

      - name: Rust checks
        working-directory: src-tauri
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      - name: Bundle (unsigned)
        run: pnpm tauri build --no-bundle
