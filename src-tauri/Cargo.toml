[package]
name = "framely"
version = "0.2.0"
description = "FrameLy — screen recording and screenshots"
authors = ["FrameLy"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "framely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Builds and links the Swift engine. Only needed (and only linkable) when the build runs on macOS.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.9", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
dirs = "6"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.42", features = ["bundled"] }
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
percent-encoding = "2"
nnnoiseless = { version = "0.5", default-features = false }
# FrameLy AI: HTTPS (model downloads, optional external providers) with the OS TLS stack.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
sha2 = "0.10"
# FrameLy Cloud: anonymous device identity (Ed25519, key kept in the OS keychain).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
base64 = "0.23"

# Speech recognition (whisper.cpp). Metal on macOS; CPU (AVX2) on Windows. The summary/topics
# model runs in the separate `framely-llm` process (llm-worker/): whisper.cpp and llama.cpp each
# vendor a different ggml version, which must not be linked into one binary.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[features]
# Windows test builds that also encode each recording at other quality levels (see
# `platform::windows::recorder::calibration_writers`).
calibration = []

[target.'cfg(windows)'.dependencies]
# `#[implement]` (COM callbacks) expands to `windows_core` paths.
windows-core = "0.62"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Devices_Display",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_MediaFoundation",
  "Win32_System_Performance",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
# Mock runtime for the end-to-end FrameLy AI test (intelligence::tests).
tauri = { version = "2", features = ["test"] }

# Dev builds: optimize dependencies (PNG/deflate, image ops) so captures feel real while
# iterating; our own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
