[package]
name = "framely-llm"
version = "0.1.0"
description = "FrameLy AI local language-model runtime (llama.cpp), run as a sidecar process"
edition = "2021"
publish = false

# Standalone crate (not a workspace member of the app): llama.cpp's ggml must not be linked into
# the same binary as whisper.cpp's.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["common", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["common"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
